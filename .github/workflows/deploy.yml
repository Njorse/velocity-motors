name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: velocity-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: velocity-react

      - name: Build
        run: npm run build
        working-directory: velocity-react
        env:
          VITE_SUPABASE_URL: https://occjcwalpastngzsmurf.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jY2pjd2FscGFzdG5nenNtdXJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjkzODIsImV4cCI6MjA5MjcwNTM4Mn0.exQSl5bQ9QWMv6ZFitThOtkJ2qAdlt2hSAK9iVAaP8Q

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: velocity-react/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
